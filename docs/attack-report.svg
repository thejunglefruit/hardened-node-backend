<svg xmlns="http://www.w3.org/2000/svg" width="1678" height="720" viewBox="0 0 1678 720" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
<rect width="100%" height="100%" rx="10" fill="#0f1419"/>
<circle cx="24" cy="22" r="6" fill="#ff5f56"/><circle cx="44" cy="22" r="6" fill="#ffbd2e"/><circle cx="64" cy="22" r="6" fill="#27c93f"/>
<text x="24" y="52" fill="#8b949e">$ node attack/attack.mjs</text>
<text x="24" y="78" fill="#8b949e" font-weight="bold">FAMILY</text>
<text x="225.60000000000002" y="78" fill="#8b949e" font-weight="bold">ATTACK</text>
<text x="813.6" y="78" fill="#8b949e" font-weight="bold">EXPECTED</text>
<text x="1233.6" y="78" fill="#8b949e" font-weight="bold">GOT</text>
<text x="1620" y="78" fill="#8b949e" font-weight="bold"></text>
<rect x="16" y="85" width="1646" height="24" fill="#161b22"/>
<text x="24" y="102" fill="#e6edf3" font-weight="bold">Brute force</text>
<text x="225.60000000000002" y="102" fill="#c9d1d9">5 wrong API keys, then the right one</text>
<text x="813.6" y="102" fill="#c9d1d9">429 + Retry-After</text>
<text x="1233.6" y="102" fill="#79c0ff">429, retry-after 60</text>
<text x="1620" y="102" fill="#3fb950" font-weight="bold">OK</text>
<text x="24" y="126" fill="#e6edf3" font-weight="bold">IP spoofing</text>
<text x="225.60000000000002" y="126" fill="#c9d1d9">forged X-Forwarded-For / CF-Connecting-IP per try</text>
<text x="813.6" y="126" fill="#c9d1d9">still blocked</text>
<text x="1233.6" y="126" fill="#79c0ff">429</text>
<text x="1620" y="126" fill="#3fb950" font-weight="bold">OK</text>
<rect x="16" y="133" width="1646" height="24" fill="#161b22"/>
<text x="24" y="150" fill="#e6edf3" font-weight="bold">Request flood</text>
<text x="225.60000000000002" y="150" fill="#c9d1d9">200 requests in a row from one IP</text>
<text x="813.6" y="150" fill="#c9d1d9">429 after the bucket</text>
<text x="1233.6" y="150" fill="#79c0ff">first 429 at #61</text>
<text x="1620" y="150" fill="#3fb950" font-weight="bold">OK</text>
<text x="24" y="174" fill="#e6edf3" font-weight="bold">Queue flooding</text>
<text x="225.60000000000002" y="174" fill="#c9d1d9">enqueue 20 jobs into a 5-slot queue</text>
<text x="813.6" y="174" fill="#c9d1d9">429 Queue full</text>
<text x="1233.6" y="174" fill="#79c0ff">5 accepted, then 429</text>
<text x="1620" y="174" fill="#3fb950" font-weight="bold">OK</text>
<rect x="16" y="181" width="1646" height="24" fill="#161b22"/>
<text x="24" y="198" fill="#e6edf3" font-weight="bold">Body bomb</text>
<text x="225.60000000000002" y="198" fill="#c9d1d9">POST a 200 KB form body</text>
<text x="813.6" y="198" fill="#c9d1d9">413</text>
<text x="1233.6" y="198" fill="#79c0ff">413</text>
<text x="1620" y="198" fill="#3fb950" font-weight="bold">OK</text>
<text x="24" y="222" fill="#e6edf3" font-weight="bold">Body flood</text>
<text x="225.60000000000002" y="222" fill="#c9d1d9">POST 2 MB, then check the server is alive</text>
<text x="813.6" y="222" fill="#c9d1d9">413 or cut; still serving</text>
<text x="1233.6" y="222" fill="#79c0ff">ECONNRESET; health 200</text>
<text x="1620" y="222" fill="#3fb950" font-weight="bold">OK</text>
<rect x="16" y="229" width="1646" height="24" fill="#161b22"/>
<text x="24" y="246" fill="#e6edf3" font-weight="bold">URL bomb</text>
<text x="225.60000000000002" y="246" fill="#c9d1d9">GET with a 3 KB query string</text>
<text x="813.6" y="246" fill="#c9d1d9">414</text>
<text x="1233.6" y="246" fill="#79c0ff">414</text>
<text x="1620" y="246" fill="#3fb950" font-weight="bold">OK</text>
<text x="24" y="270" fill="#e6edf3" font-weight="bold">Malformed JSON</text>
<text x="225.60000000000002" y="270" fill="#c9d1d9">POST {not json</text>
<text x="813.6" y="270" fill="#c9d1d9">400</text>
<text x="1233.6" y="270" fill="#79c0ff">400</text>
<text x="1620" y="270" fill="#3fb950" font-weight="bold">OK</text>
<rect x="16" y="277" width="1646" height="24" fill="#161b22"/>
<text x="24" y="294" fill="#e6edf3" font-weight="bold">Prototype pollution</text>
<text x="225.60000000000002" y="294" fill="#c9d1d9">POST {&quot;__proto__&quot;:{&quot;polluted&quot;:true}}</text>
<text x="813.6" y="294" fill="#c9d1d9">Object.prototype clean</text>
<text x="1233.6" y="294" fill="#79c0ff">clean</text>
<text x="1620" y="294" fill="#3fb950" font-weight="bold">OK</text>
<text x="24" y="318" fill="#e6edf3" font-weight="bold">Cross-site request</text>
<text x="225.60000000000002" y="318" fill="#c9d1d9">Origin: https://evil.example</text>
<text x="813.6" y="318" fill="#c9d1d9">403</text>
<text x="1233.6" y="318" fill="#79c0ff">403</text>
<text x="1620" y="318" fill="#3fb950" font-weight="bold">OK</text>
<rect x="16" y="325" width="1646" height="24" fill="#161b22"/>
<text x="24" y="342" fill="#e6edf3" font-weight="bold">Sandboxed iframe</text>
<text x="225.60000000000002" y="342" fill="#c9d1d9">Origin: null</text>
<text x="813.6" y="342" fill="#c9d1d9">403</text>
<text x="1233.6" y="342" fill="#79c0ff">403</text>
<text x="1620" y="342" fill="#3fb950" font-weight="bold">OK</text>
<text x="24" y="366" fill="#e6edf3" font-weight="bold">Look-alike origin</text>
<text x="225.60000000000002" y="366" fill="#c9d1d9">public route from www.example.test.evil.com</text>
<text x="813.6" y="366" fill="#c9d1d9">403</text>
<text x="1233.6" y="366" fill="#79c0ff">403</text>
<text x="1620" y="366" fill="#3fb950" font-weight="bold">OK</text>
<rect x="16" y="373" width="1646" height="24" fill="#161b22"/>
<text x="24" y="390" fill="#e6edf3" font-weight="bold">CORS write</text>
<text x="225.60000000000002" y="390" fill="#c9d1d9">POST to the public read-only route</text>
<text x="813.6" y="390" fill="#c9d1d9">403</text>
<text x="1233.6" y="390" fill="#79c0ff">403</text>
<text x="1620" y="390" fill="#3fb950" font-weight="bold">OK</text>
<text x="24" y="414" fill="#e6edf3" font-weight="bold">Error leak</text>
<text x="225.60000000000002" y="414" fill="#c9d1d9">trigger an exception carrying a secret</text>
<text x="813.6" y="414" fill="#c9d1d9">500 &quot;Internal error&quot;</text>
<text x="1233.6" y="414" fill="#79c0ff">500 no detail</text>
<text x="1620" y="414" fill="#3fb950" font-weight="bold">OK</text>
<rect x="16" y="421" width="1646" height="24" fill="#161b22"/>
<text x="24" y="438" fill="#e6edf3" font-weight="bold">Fingerprinting</text>
<text x="225.60000000000002" y="438" fill="#c9d1d9">read response headers</text>
<text x="813.6" y="438" fill="#c9d1d9">nosniff, DENY, no-store, no x-powered-by</text>
<text x="1233.6" y="438" fill="#79c0ff">all present</text>
<text x="1620" y="438" fill="#3fb950" font-weight="bold">OK</text>
<text x="24" y="462" fill="#e6edf3" font-weight="bold">SQL injection</text>
<text x="225.60000000000002" y="462" fill="#c9d1d9">API key ' OR 1=1 --</text>
<text x="813.6" y="462" fill="#c9d1d9">403, never reaches SQL</text>
<text x="1233.6" y="462" fill="#79c0ff">403</text>
<text x="1620" y="462" fill="#3fb950" font-weight="bold">OK</text>
<rect x="16" y="469" width="1646" height="24" fill="#161b22"/>
<text x="24" y="486" fill="#e6edf3" font-weight="bold">Log harvesting</text>
<text x="225.60000000000002" y="486" fill="#c9d1d9">bad key in the URL, then read the log</text>
<text x="813.6" y="486" fill="#c9d1d9">apikey=*** in the log</text>
<text x="1233.6" y="486" fill="#79c0ff">redacted</text>
<text x="1620" y="486" fill="#3fb950" font-weight="bold">OK</text>
<text x="24" y="510" fill="#e6edf3" font-weight="bold">SSRF loopback</text>
<text x="225.60000000000002" y="510" fill="#c9d1d9">image=http://127.0.0.1/health via the API</text>
<text x="813.6" y="510" fill="#c9d1d9">400 Destination not allowed</text>
<text x="1233.6" y="510" fill="#79c0ff">400 Destination not allowed</text>
<text x="1620" y="510" fill="#3fb950" font-weight="bold">OK</text>
<rect x="16" y="517" width="1646" height="24" fill="#161b22"/>
<text x="24" y="534" fill="#e6edf3" font-weight="bold">SSRF obfuscated IP</text>
<text x="225.60000000000002" y="534" fill="#c9d1d9">decimal, hex, octal, IPv4-mapped IPv6, fullwidth dots</text>
<text x="813.6" y="534" fill="#c9d1d9">all rejected</text>
<text x="1233.6" y="534" fill="#79c0ff">6/6 rejected</text>
<text x="1620" y="534" fill="#3fb950" font-weight="bold">OK</text>
<text x="24" y="558" fill="#e6edf3" font-weight="bold">SSRF cloud metadata</text>
<text x="225.60000000000002" y="558" fill="#c9d1d9">169.254.169.254, metadata.google.internal.</text>
<text x="813.6" y="558" fill="#c9d1d9">all rejected</text>
<text x="1233.6" y="558" fill="#79c0ff">3/3 rejected</text>
<text x="1620" y="558" fill="#3fb950" font-weight="bold">OK</text>
<rect x="16" y="565" width="1646" height="24" fill="#161b22"/>
<text x="24" y="582" fill="#e6edf3" font-weight="bold">SSRF local names</text>
<text x="225.60000000000002" y="582" fill="#c9d1d9">localhost., router.local, *.internal</text>
<text x="813.6" y="582" fill="#c9d1d9">all rejected</text>
<text x="1233.6" y="582" fill="#79c0ff">3/3 rejected</text>
<text x="1620" y="582" fill="#3fb950" font-weight="bold">OK</text>
<text x="24" y="606" fill="#e6edf3" font-weight="bold">SSRF tricks</text>
<text x="225.60000000000002" y="606" fill="#c9d1d9">userinfo, odd port, ftp scheme</text>
<text x="813.6" y="606" fill="#c9d1d9">all rejected</text>
<text x="1233.6" y="606" fill="#79c0ff">4/4 rejected</text>
<text x="1620" y="606" fill="#3fb950" font-weight="bold">OK</text>
<rect x="16" y="613" width="1646" height="24" fill="#161b22"/>
<text x="24" y="630" fill="#e6edf3" font-weight="bold">Memory exhaustion</text>
<text x="225.60000000000002" y="630" fill="#c9d1d9">100 000 distinct client IPs</text>
<text x="813.6" y="630" fill="#c9d1d9">table stays bounded</text>
<text x="1233.6" y="630" fill="#79c0ff">50000 entries</text>
<text x="1620" y="630" fill="#3fb950" font-weight="bold">OK</text>
<text x="24" y="654" fill="#e6edf3" font-weight="bold">Slowloris</text>
<text x="225.60000000000002" y="654" fill="#c9d1d9">server timeouts</text>
<text x="813.6" y="654" fill="#c9d1d9">headers &lt;= 15 s, request &lt;= 30 s</text>
<text x="1233.6" y="654" fill="#79c0ff">15 s / 30 s</text>
<text x="1620" y="654" fill="#3fb950" font-weight="bold">OK</text>
<text x="24" y="700" fill="#3fb950" font-weight="bold">24/24 attacks stopped</text>
</svg>
