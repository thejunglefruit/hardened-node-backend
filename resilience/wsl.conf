# /etc/wsl.conf of a dedicated WSL distro for the app. Apply with: wsl --terminate <distro>

[boot]
# systemd starts the services (app, litestream, watchdog) without anyone opening a terminal.
systemd=true

[automount]
# Isolation: the Windows drives are NOT mounted inside. If the app or a dependency is compromised, it cannot
# reach the host's files. Deployments go in through a tar stream on stdin.
enabled=false
mountFsTab=false

[interop]
# No launching Windows executables from inside, no inherited Windows PATH (same reason).
enabled=false
appendWindowsPath=false

[network]
generateResolvConf=true

[user]
# The default user is not root; the service runs as "app" (no password login).
default=app
